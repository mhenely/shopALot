# Netlify build config for the shopALot frontend (monorepo).
# base = the frontend/ subdir; command + publish are resolved relative to it.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (e.g. /categories/cooking) resolve on reload.
# (Also covered by frontend/public/_redirects; kept here as belt-and-suspenders.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
